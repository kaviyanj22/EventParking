<div class="event-form-card">

  <div class="form-header">
    <h2>
      {{ event ? 'Edit Event' : 'Add Event' }}
    </h2>

    <p>
      {{
        event
          ? 'Update the event information.'
          : 'Enter the details for the new event.'
      }}
    </p>
  </div>

  <!-- Success -->
  <div
    class="message success-message"
    *ngIf="successMessage"
  >
    {{ successMessage }}
  </div>

  <!-- Error -->
  <div
    class="message error-message"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </div>

  <form
    [formGroup]="eventForm"
    (ngSubmit)="saveEvent()"
  >

    <!-- Event Name -->
    <div class="form-group">
      <label for="eventName">Event Name</label>

      <input
        id="eventName"
        type="text"
        formControlName="eventName"
        placeholder="Enter event name"
      />

      <small
        class="validation-error"
        *ngIf="
          eventForm.get('eventName')?.invalid &&
          eventForm.get('eventName')?.touched
        "
      >
        Event name is required.
      </small>
    </div>

    <!-- Venue -->
    <div class="form-group">
      <label for="venueId">Venue</label>

      <select
        id="venueId"
        formControlName="venueId"
      >
        <option [ngValue]="0">
          Select Venue
        </option>

        <option
          *ngFor="let venue of venues"
          [ngValue]="venue.venueId"
        >
          {{ venue.venueName }}
        </option>
      </select>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="categoryId">Category</label>

      <select
        id="categoryId"
        formControlName="categoryId"
      >
        <option [ngValue]="0">
          Select Category
        </option>

        <option
          *ngFor="let category of categories"
          [ngValue]="category.categoryId"
        >
          {{ category.categoryName }}
        </option>
      </select>
    </div>

    <!-- Event Date -->
    <div class="form-group">
      <label for="eventDate">Event Date</label>

      <input
        id="eventDate"
        type="date"
        formControlName="eventDate"
      />
    </div>

    <!-- Time -->
    <div class="form-row">

      <div class="form-group">
        <label for="startTime">Start Time</label>

        <input
          id="startTime"
          type="time"
          formControlName="startTime"
        />
      </div>

      <div class="form-group">
        <label for="endTime">End Time</label>

        <input
          id="endTime"
          type="time"
          formControlName="endTime"
        />
      </div>

    </div>

    <!-- Price + Capacity -->
    <div class="form-row">

      <div class="form-group">
        <label for="ticketPrice">
          Ticket Price (LKR)
        </label>

        <input
          id="ticketPrice"
          type="number"
          min="0"
          formControlName="ticketPrice"
        />
      </div>

      <div class="form-group">
        <label for="capacity">
          Capacity
        </label>

        <input
          id="capacity"
          type="number"
          min="1"
          formControlName="capacity"
        />
      </div>

    </div>

    <!-- Parking Fee -->
    <div class="form-group">
      <label for="parkingFee">
        Parking Fee (LKR)
      </label>

      <input
        id="parkingFee"
        type="number"
        min="0"
        formControlName="parkingFee"
      />
    </div>

    <!-- Seating Layout -->
    <div class="form-group">
      <label for="seatingLayoutImageUrl">
        Seating Layout Image URL
      </label>

      <input
        id="seatingLayoutImageUrl"
        type="text"
        formControlName="seatingLayoutImageUrl"
        placeholder="Enter image URL (optional)"
      />
    </div>

    <!-- Buttons -->
    <div class="form-actions">

      <button
        type="button"
        class="cancel-btn"
        (click)="cancel()"
        [disabled]="submitting"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="save-btn"
        [disabled]="eventForm.invalid || submitting"
      >
        {{
          submitting
            ? 'Saving...'
            : (event ? 'Update Event' : 'Add Event')
        }}
      </button>

    </div>

  </form>

</div>
